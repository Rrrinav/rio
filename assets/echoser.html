<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rio Console</title>
    <style>
        body { background: #0a0a0a; color: #d4d4d4; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .terminal { flex: 1; overflow-y: auto; padding: 20px; border-bottom: 1px solid #222; }
        .input-area { padding: 20px; background: #0f0f0f; display: flex; gap: 10px; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #00ff00; padding: 10px; outline: none; }
        button { background: #333; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        button:hover { background: #444; }
        .log-entry { margin-bottom: 8px; border-left: 2px solid #00ff00; padding-left: 10px; }
        .timestamp { color: #555; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="terminal" id="logs">
        <div class="log-entry">Echo server</div>
    </div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Send payload..." autofocus>
        <button onclick="send()">Send</button>
    </div>
    <script>
        const input = document.getElementById('msgInput');
        const logs = document.getElementById('logs');

        async function send() {
            const val = input.value;
            if(!val) return;
            input.value = '';

            try {
                const res = await fetch('/api/echo', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: val})
                });
                const data = await res.json();

                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `<span class="timestamp">[${new Date().toLocaleTimeString()}]</span><span>${data.echo}</span>`;
                logs.appendChild(entry);
                logs.scrollTop = logs.scrollHeight;
            } catch(e) {
                console.error("Link failure");
            }
        }
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
