<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rio Echo</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0d0d0d;
            color: #d4d4d4;
            font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 14px 20px;
            border-bottom: 1px solid #1e1e1e;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3fb950;
            flex-shrink: 0;
        }

        header span {
            font-size: 13px;
            color: #888;
        }

        header strong {
            font-size: 13px;
            color: #e0e0e0;
            font-weight: 500;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

        .bubble-row {
            display: flex;
            flex-direction: column;
            max-width: 72%;
        }

        .bubble-row.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .bubble-row.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .bubble {
            padding: 9px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .sent .bubble {
            background: #1a3a2a;
            color: #7ee8a2;
            border-bottom-right-radius: 4px;
            border: 1px solid #2a5a3a;
        }

        .received .bubble {
            background: #1a1a2e;
            color: #94b8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid #1e2e4a;
        }

        .bubble-meta {
            font-size: 10px;
            color: #444;
            margin-top: 3px;
            padding: 0 4px;
        }

        .label-tag {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.04em;
            margin-bottom: 3px;
            padding: 0 4px;
            color: #555;
        }

        .sent .label-tag { color: #3a7a50; }
        .received .label-tag { color: #3a5a8a; }

        .system-msg {
            align-self: center;
            font-size: 11px;
            color: #3a3a3a;
            margin: 8px 0;
        }

        .composer {
            flex-shrink: 0;
            padding: 12px 16px;
            border-top: 1px solid #1a1a1a;
            background: #0a0a0a;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .composer input {
            flex: 1;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #d4d4d4;
            font-family: inherit;
            font-size: 13px;
            padding: 10px 14px;
            outline: none;
            transition: border-color 0.15s;
            line-height: 1.4;
        }

        .composer input:focus {
            border-color: #3a5a3a;
        }

        .composer input::placeholder { color: #3a3a3a; }

        .send-btn {
            background: #1a3a2a;
            border: 1px solid #2a5a3a;
            border-radius: 10px;
            color: #7ee8a2;
            font-family: inherit;
            font-size: 12px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.12s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .send-btn:hover { background: #1f4a32; }
        .send-btn:active { background: #153020; }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 10px 14px;
            background: #1a1a2e;
            border: 1px solid #1e2e4a;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            gap: 5px;
            align-items: center;
        }

        .typing-indicator.visible {
            display: flex;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4a6a9a;
            animation: pulse 1.2s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
            40% { opacity: 1; transform: scale(1); }
        }

        .error-bubble {
            align-self: center;
            font-size: 11px;
            color: #8b3a3a;
            background: #1a0a0a;
            border: 1px solid #3a1a1a;
            border-radius: 8px;
            padding: 6px 12px;
            margin: 4px 0;
        }
    </style>
</head>
<body>

<header>
    <div class="status-dot"></div>
    <strong>rio echo</strong>
    <span>localhost:8080/api/echo</span>
</header>

<div class="messages" id="messages">
    <div class="system-msg">connection established</div>
</div>

<div class="composer">
    <input type="text" id="msgInput" placeholder="type a message…" autocomplete="off" autofocus>
    <button class="send-btn" id="sendBtn" onclick="send()">send ↑</button>
</div>

<script>
    const input   = document.getElementById('msgInput');
    const log     = document.getElementById('messages');
    const sendBtn = document.getElementById('sendBtn');

    function ts() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function addBubble(text, side, label) {
        const row = document.createElement('div');
        row.className = `bubble-row ${side}`;

        const tag = document.createElement('div');
        tag.className = 'label-tag';
        tag.textContent = label;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        const meta = document.createElement('div');
        meta.className = 'bubble-meta';
        meta.textContent = ts();

        row.appendChild(tag);
        row.appendChild(bubble);
        row.appendChild(meta);
        log.appendChild(row);
        log.scrollTop = log.scrollHeight;
        return row;
    }

    function addTyping() {
        const el = document.createElement('div');
        el.className = 'typing-indicator visible';
        el.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
    }

    function addError(msg) {
        const el = document.createElement('div');
        el.className = 'error-bubble';
        el.textContent = msg;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
    }

    async function send() {
        const val = input.value.trim();
        if (!val) return;
        input.value = '';
        sendBtn.disabled = true;

        addBubble(val, 'sent', 'you');

        const typing = addTyping();

        try {
            const res = await fetch('/api/echo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: val })
            });

            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const data = await res.json();
            typing.remove();
            addBubble(data.echo, 'received', 'echo ←');
        } catch (e) {
            typing.remove();
            addError(`error: ${e.message}`);
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    }

    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
</script>
</body>
</html>
